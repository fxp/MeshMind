# MeshMind 本地开发基础设施
# P0 只需要 NATS。Postgres 为 P2+ 的注册表/审计预留。
# 启动: docker compose -f infra/docker-compose.yml up -d
services:
  nats:
    image: nats:2.10-alpine
    container_name: meshmind-nats
    command:
      - "-js"                       # 启用 JetStream
      - "-m"                        # 监控端口
      - "8222"
      - "-sd"                       # JetStream 存储目录
      - "/data"
    ports:
      - "4222:4222"                 # 客户端
      - "8222:8222"                 # 监控 http://localhost:8222
    volumes:
      - nats-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: meshmind-postgres
    environment:
      POSTGRES_USER: meshmind
      POSTGRES_PASSWORD: meshmind
      POSTGRES_DB: meshmind
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nats-data:
  pg-data:
