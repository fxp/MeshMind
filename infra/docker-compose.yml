# MeshMind 历史原型的本地开发基础设施。
# 先运行 ./infra/init-local-env.sh，再使用 --env-file infra/.env 启动。
services:
  nats:
    image: nats:2.10-alpine
    container_name: meshmind-nats
    command:
      - "-js"                       # 启用 JetStream
      - "-m"                        # 监控端口
      - "8222"
      - "-sd"                       # JetStream 存储目录
      - "/data"
      - "--user"
      - "${NATS_USERNAME:?Run ./infra/init-local-env.sh first}"
      - "--pass"
      - "${NATS_PASSWORD:?Run ./infra/init-local-env.sh first}"
    ports:
      - "127.0.0.1:4222:4222"       # 仅本机客户端
      - "127.0.0.1:8222:8222"       # 仅本机监控 http://localhost:8222
    volumes:
      - nats-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: meshmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meshmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./infra/init-local-env.sh first}
      POSTGRES_DB: meshmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nats-data:
  pg-data:
